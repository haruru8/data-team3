<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アイスボンバー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
:root{
  --bg:#0a0a0d;
  --panel:#1a1b20;
  --panel-2:#232429;
  --line:#3c3d44;
  --text:#ffffff;
  --text-dim:#9a9aa4;
  --fuse-1:#ff3b3b;
  --fuse-2:#c40018;
  --gold:#ffd400;
  --gold-2:#ffa800;
  --ok:#39ff8a;
  --bad:#ff1b2e;
  --radius:16px;
  --font-display:'M PLUS Rounded 1c', sans-serif;
  --font-body:'Zen Kaku Gothic New', sans-serif;
  --font-mono:'JetBrains Mono', monospace;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:
    repeating-linear-gradient(135deg, rgba(255,212,0,0.035) 0 26px, transparent 26px 52px),
    radial-gradient(1100px 650px at 20% -10%, rgba(255,59,59,0.16), transparent 55%),
    radial-gradient(900px 600px at 100% 0%, rgba(255,212,0,0.08), transparent 50%),
    var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:36px 14px 60px;
}
#app{
  width:100%;
  max-width:460px;
  position:relative;
  z-index:1;
}
.screen{
  animation:fadeUp .38s ease;
}
@keyframes fadeUp{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}
@media (prefers-reduced-motion: reduce){
  .screen{animation:none;}
}

/* ---------- shared bits ---------- */
.eyebrow{
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:.14em;
  color:var(--fuse-1);
  text-transform:uppercase;
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:10px;
}
.eyebrow::before{
  content:"";
  width:14px;height:2px;
  background:linear-gradient(90deg,var(--fuse-1),var(--fuse-2));
  border-radius:2px;
}
h1.page-title{
  font-family:var(--font-display);
  font-weight:900;
  font-size:26px;
  line-height:1.3;
  margin:0 0 4px;
  letter-spacing:.01em;
}
p.sub{
  color:var(--text-dim);
  font-size:13.5px;
  line-height:1.7;
  margin:0 0 22px;
}
.card{
  background:var(--panel);
  border:2.5px solid #000;
  border-radius:var(--radius);
  padding:22px 20px;
  margin-bottom:14px;
  box-shadow:5px 5px 0 rgba(0,0,0,.85);
}

/* ---- 警戒テープ / サイレン / スポットライト（ネプリーグ演出） ---- */
.hazard-tape{
  height:11px;
  background:repeating-linear-gradient(135deg, var(--gold) 0 14px, #111 14px 28px);
  border:1.5px solid #000;
  border-radius:3px;
  margin:14px 0;
}
.sunburst-wrap{position:relative; overflow:hidden; border-radius:20px;}
.sunburst-wrap::before{
  content:"";
  position:absolute; inset:-70%;
  background:repeating-conic-gradient(from 0deg, rgba(255,212,0,0.16) 0deg 9deg, transparent 9deg 18deg);
  animation:spinBurst 55s linear infinite;
  z-index:0;
}
.sunburst-wrap > *{position:relative; z-index:1;}
@keyframes spinBurst{to{transform:rotate(360deg);}}
.eyebrow.alarm::before{
  content:"";
  width:14px; height:2px; border-radius:2px;
  background:var(--fuse-1);
  animation:none;
}
.eyebrow.alarm .siren-dot{
  width:9px; height:9px; border-radius:50%;
  background:var(--fuse-1);
  display:inline-block;
  box-shadow:0 0 9px 3px rgba(255,59,59,.75);
  animation:sirenBlink .6s steps(1) infinite;
  margin-right:2px;
}
@keyframes sirenBlink{50%{background:var(--gold); box-shadow:0 0 9px 3px rgba(255,212,0,.75);}}
.tv-title{
  font-family:var(--font-display);
  font-weight:900;
  color:#fff;
  -webkit-text-stroke:2px #000;
  text-shadow:3px 3px 0 var(--fuse-1), 6px 6px 0 rgba(0,0,0,.5);
  letter-spacing:.01em;
}
.explosion-overlay{
  position:fixed; inset:0; z-index:999;
  background:radial-gradient(circle, rgba(255,190,0,.97) 0%, rgba(255,27,46,.97) 42%, rgba(5,5,5,.97) 100%);
  display:flex; align-items:center; justify-content:center;
  animation:flashIn 1.5s ease forwards;
}
.boom-text{
  font-family:var(--font-display); font-weight:900; font-size:15vw; max-font-size:52px;
  color:#fff; -webkit-text-stroke:3px #000;
  text-shadow:5px 5px 0 #000;
  animation:boomPop .5s cubic-bezier(.34,1.8,.64,1);
  text-align:center;
}
@keyframes boomPop{0%{transform:scale(.2) rotate(-8deg); opacity:0;} 60%{transform:scale(1.18) rotate(3deg); opacity:1;} 100%{transform:scale(1) rotate(0deg);}}
@keyframes flashIn{0%{opacity:0;} 15%{opacity:1;} 85%{opacity:1;} 100%{opacity:0;}}
#app.shake{animation:shakeApp .5s;}
@keyframes shakeApp{0%,100%{transform:translateX(0);} 20%{transform:translateX(-7px);} 40%{transform:translateX(7px);} 60%{transform:translateX(-5px);} 80%{transform:translateX(5px);}}
@media (prefers-reduced-motion: reduce){
  .sunburst-wrap::before, .boom-text, .explosion-overlay, #app.shake, .eyebrow.alarm .siren-dot{animation:none;}
}

/* =========================================================
   氷⇔警報：フェーズ別テーマ（ロビー系は氷、クイズ本番は警報）
========================================================= */
:root{
  --ice-bg-1:#cfeff7;
  --ice-bg-2:#bfe7f2;
  --ice-panel:#16303e;
  --ice-panel-2:#1c3a4a;
  --ice-line:#2f5468;
  --ice-accent:#7fe0ff;
  --ice-accent-2:#c9f3ff;
  --ice-text:#173746;
  --ice-text-dim:#496b79;
}
body.phase-ice{
  background:
    radial-gradient(1000px 620px at 15% -10%, rgba(255,255,255,.4), transparent 55%),
    var(--ice-bg-1);
  transition:background .6s ease;
}
body.phase-ice .screen > .page-title{
  color:var(--ice-text);
}
body.phase-ice .screen > p.sub{
  color:var(--ice-text-dim);
}
body.phase-ice .screen > .eyebrow{
  color:#16718e;
}
body.phase-hot{
  background:
    repeating-linear-gradient(135deg, rgba(255,212,0,0.035) 0 26px, transparent 26px 52px),
    radial-gradient(1100px 650px at 20% -10%, rgba(255,59,59,0.16), transparent 55%),
    radial-gradient(900px 600px at 100% 0%, rgba(255,212,0,0.08), transparent 50%),
    var(--bg);
  transition:background .6s ease;
}
body.phase-ice .card,
body.phase-ice .choice-card,
body.phase-ice .qcard{
  background:var(--ice-panel);
  border-color:#000;
  box-shadow:5px 5px 0 rgba(0,20,30,.7);
}
body.phase-ice .eyebrow{color:var(--ice-accent);}
body.phase-ice .eyebrow::before{background:linear-gradient(90deg,var(--ice-accent),var(--ice-accent-2));}
body.phase-ice .tv-title{
  text-shadow:3px 3px 0 var(--ice-accent), 6px 6px 0 rgba(0,20,30,.5);
}
body.phase-ice .btn-primary{
  background:linear-gradient(180deg,var(--ice-accent-2),var(--ice-accent));
  color:#04222f;
}
body.phase-ice .btn-secondary:hover{border-color:var(--ice-accent);}
body.phase-ice .choice-card:hover{border-color:var(--ice-accent);}
body.phase-ice .code-display{
  border-color:var(--ice-accent);
  box-shadow:0 0 0 3px rgba(127,224,255,.18), 4px 4px 0 rgba(0,0,0,.7);
}
body.phase-ice input[type=text], body.phase-ice input[type=number]{
  border-color:var(--ice-line);
}
body.phase-ice input[type=text]:focus, body.phase-ice input[type=number]:focus{
  border-color:var(--ice-accent);
}
body.phase-ice .hazard-tape{
  background:repeating-linear-gradient(135deg, var(--ice-accent) 0 14px, #0a1a22 14px 28px);
}
body.phase-ice .stamp.clear{color:var(--ice-accent); text-shadow:3px 3px 0 #000;}
body.phase-ice .sunburst-wrap::before{
  background:repeating-conic-gradient(from 0deg, rgba(127,224,255,0.16) 0deg 9deg, transparent 9deg 18deg);
}

/* 霜つき爆弾マーク */
.frost-bomb{
  position:relative; display:inline-block; font-size:48px;
  filter:drop-shadow(0 0 10px rgba(127,224,255,.35));
}
.frost-bomb::after{
  content:"❄️";
  position:absolute; right:-6px; bottom:-4px;
  font-size:20px;
}

/* 雪の粒子（氷フェーズのみ） */
.snowfield{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0;}
.snowfield span{
  position:absolute; top:-5%; color:rgba(74,157,184,.58); font-size:12px;
  animation:snowFall linear infinite;
}
@keyframes snowFall{
  to{ transform:translateY(115vh) translateX(var(--drift,0px)); }
}
@media (prefers-reduced-motion: reduce){ .snowfield{display:none;} }

/* 導火線プログレスバー（常時表示） */
#fuseBar{
  position:fixed; top:0; left:0; right:0; height:5px; z-index:500;
  background:rgba(255,255,255,.06);
}
#fuseBar .fill{
  height:100%; width:0%;
  background:linear-gradient(90deg, var(--ice-accent), var(--gold), var(--fuse-1));
  transition:width .5s ease;
  position:relative;
}
#fuseBar .fill::after{
  content:"🔥"; position:absolute; right:-9px; top:-9px; font-size:15px;
  filter:drop-shadow(0 0 4px rgba(255,138,0,.8));
}

/* 点火フラッシュ（氷フェーズ→警報フェーズへ切り替わる瞬間） */
.ignite-overlay{
  position:fixed; inset:0; z-index:999;
  background:radial-gradient(circle, rgba(255,180,60,.9) 0%, rgba(196,0,24,.55) 55%, rgba(5,5,5,0) 100%);
  display:flex; align-items:center; justify-content:center;
  animation:igniteFlash 1.5s ease forwards;
}
.ignite-text{
  font-family:var(--font-display); font-weight:900; font-size:8vw;
  color:#fff; -webkit-text-stroke:2px #000; text-shadow:3px 3px 0 #000;
}
@keyframes igniteFlash{0%{opacity:0;} 25%{opacity:1;} 100%{opacity:0;}}
@media (prefers-reduced-motion: reduce){ .ignite-overlay{animation:none; opacity:0;} }
label.field-label{
  display:block;
  font-size:12px;
  color:var(--text-dim);
  margin:0 0 8px;
  font-weight:700;
}
input[type=text], input[type=number]{
  width:100%;
  background:var(--bg);
  border:1.5px solid var(--line);
  border-radius:12px;
  padding:13px 14px;
  color:var(--text);
  font-family:var(--font-body);
  font-size:15px;
  outline:none;
  transition:border-color .15s;
}
input[type=text]:focus, input[type=number]:focus{
  border-color:var(--fuse-1);
}
.field{margin-bottom:16px;}
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
  padding:14px 18px;
  border-radius:14px;
  border:none;
  font-family:var(--font-display);
  font-weight:800;
  font-size:15px;
  cursor:pointer;
  transition:transform .12s ease, filter .12s ease, opacity .12s;
  letter-spacing:.01em;
}
.btn:active{transform:scale(0.97);}
.btn-primary{
  background:linear-gradient(180deg,var(--gold),var(--gold-2));
  color:#161200;
  border:2.5px solid #000;
  box-shadow:4px 4px 0 #000;
}
.btn-primary:hover{filter:brightness(1.04);}
.btn-primary:active{transform:translate(2px,2px); box-shadow:2px 2px 0 #000;}
.btn-secondary{
  background:var(--panel-2);
  border:2.5px solid #000;
  color:var(--text);
  box-shadow:4px 4px 0 rgba(0,0,0,.6);
}
.btn-secondary:hover{border-color:var(--fuse-1);}
.btn-secondary:active{transform:translate(2px,2px); box-shadow:2px 2px 0 rgba(0,0,0,.6);}
.btn-ghost{
  background:transparent;
  color:var(--text-dim);
  border:1.5px dashed var(--line);
}
.btn:disabled{opacity:.35; cursor:not-allowed; transform:none;}
.btn-row{display:flex; gap:10px;}
.btn-row .btn{width:auto; flex:1;}
.choice-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px;}
.choice-card{
  background:var(--panel);
  border:2.5px solid #000;
  border-radius:16px;
  padding:20px 14px;
  text-align:center;
  cursor:pointer;
  transition:.15s;
  box-shadow:4px 4px 0 rgba(0,0,0,.75);
}
.choice-card:hover{border-color:var(--fuse-1); transform:translate(-1px,-3px); box-shadow:5px 7px 0 rgba(0,0,0,.75);}
.choice-card .ic{font-size:26px; display:block; margin-bottom:8px;}
.choice-card .lbl{font-family:var(--font-display); font-weight:800; font-size:14px;}
.back-link{
  background:none; border:none; color:var(--text-dim);
  font-family:var(--font-mono); font-size:12px; cursor:pointer;
  padding:6px 0; margin-bottom:14px; display:inline-flex; align-items:center; gap:5px;
}
.back-link:hover{color:var(--fuse-1);}
.chip{
  display:inline-flex; align-items:center; gap:6px;
  background:var(--panel-2); border:1px solid var(--line);
  border-radius:999px; padding:5px 11px; font-size:11.5px; color:var(--text-dim);
  font-family:var(--font-mono);
}
.time-strip{
  display:flex; gap:10px; margin-bottom:18px;
}
.time-strip .box{
  flex:1; background:var(--panel-2); border:1px solid var(--line);
  border-radius:12px; padding:11px 12px;
}
.time-strip .box .n{
  font-family:var(--font-mono); font-weight:700; font-size:18px; color:var(--gold);
}
.time-strip .box .l{font-size:10.5px; color:var(--text-dim); margin-top:2px;}

/* room code */
.code-display{
  font-family:var(--font-mono);
  font-size:32px;
  font-weight:800;
  letter-spacing:.12em;
  color:var(--gold);
  text-align:center;
  padding:18px 0;
  background:#000;
  border-radius:14px;
  border:2.5px solid var(--fuse-1);
  box-shadow:0 0 0 3px rgba(255,59,59,.18), 4px 4px 0 rgba(0,0,0,.7);
  margin-bottom:6px;
}

/* participants list */
.plist{list-style:none; margin:0; padding:0;}
.plist li{
  display:flex; align-items:center; gap:10px;
  padding:10px 4px; border-bottom:1px solid var(--line);
  font-size:14px;
}
.plist li:last-child{border-bottom:none;}
.avatar{
  width:30px;height:30px;border-radius:50%;
  background:linear-gradient(135deg,var(--fuse-1),var(--fuse-2));
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:800; font-size:13px; color:#1a1310;
  flex-shrink:0;
}
.host-tag{
  margin-left:auto; font-size:10px; color:var(--gold); font-family:var(--font-mono);
  border:1px solid var(--gold); border-radius:6px; padding:2px 6px;
}

/* circular table */
.table-wrap{
  position:relative;
  width:280px; height:280px;
  margin:10px auto 22px;
}
.table-center{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:150px; height:150px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #201417, #050505);
  border:3px solid var(--gold);
  box-shadow:0 0 0 5px rgba(0,0,0,.6), 0 0 22px rgba(255,212,0,.25);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:4px;
}
.table-center .timer-num{
  font-family:var(--font-mono); font-weight:800; font-size:34px; color:var(--gold);
}
.table-center.danger{border-color:var(--fuse-1); animation:sirenRing .5s infinite alternate;}
.table-center.danger .timer-num{color:var(--fuse-1); animation:pulse .5s infinite alternate;}
@keyframes pulse{from{transform:scale(1);} to{transform:scale(1.12);}}
@keyframes sirenRing{from{box-shadow:0 0 0 5px rgba(0,0,0,.6), 0 0 26px rgba(255,59,59,.55);} to{box-shadow:0 0 0 5px rgba(0,0,0,.6), 0 0 8px rgba(255,59,59,.2);}}
.table-center .timer-lbl{font-size:10px; color:var(--text-dim); font-family:var(--font-mono);}
.seat{
  position:absolute;
  width:58px; height:58px;
  transform:translate(-50%,-50%);
  display:flex; flex-direction:column; align-items:center; gap:4px;
}
.seat .av{
  width:44px;height:44px;border-radius:50%;
  background:var(--panel-2); border:2px solid var(--line);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:800; font-size:15px;
  transition:.25s;
}
.seat .nm{font-size:10.5px; color:var(--text-dim); max-width:60px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.seat.active .av{
  border-color:var(--fuse-1);
  background:linear-gradient(135deg,rgba(255,138,61,.25),rgba(255,61,61,.15));
  box-shadow:0 0 0 4px rgba(255,138,61,.15);
}
.seat.active .nm{color:var(--gold); font-weight:700;}
.seat.done .av{border-color:var(--ok); opacity:.55;}
.bomb-icon{
  position:absolute;
  font-size:20px;
  transition:all .5s cubic-bezier(.34,1.56,.64,1);
  filter:drop-shadow(0 2px 6px rgba(255,61,61,.6));
}

/* ---- 解答台 + 吊り爆弾（本家ファイブボンバーの舞台セット再現） ---- */
.podium-stage{
  position:relative;
  background:
    repeating-linear-gradient(100deg, rgba(255,255,255,0.035) 0 2px, transparent 2px 40px),
    radial-gradient(120% 100% at 50% 0%, rgba(70,90,255,.20), transparent 62%),
    linear-gradient(180deg, #0b0c16, #050507);
  border:2.5px solid #000;
  border-radius:16px;
  box-shadow:5px 5px 0 rgba(0,0,0,.8);
  padding:14px 10px 0;
  overflow:hidden;
  margin-bottom:14px;
}
.studio-clock{
  width:96px; margin:0 auto 10px;
  background:#000; border:2.5px solid var(--gold);
  border-radius:10px; text-align:center; padding:6px 0 5px;
  box-shadow:0 0 16px rgba(255,212,0,.25);
}
.studio-clock .num{
  font-family:var(--font-mono); font-weight:800; font-size:26px; color:var(--fuse-1);
  line-height:1;
}
.studio-clock.danger .num{color:var(--fuse-1); animation:pulse .5s infinite alternate;}
.studio-clock .lbl{font-size:8.5px; color:var(--text-dim); font-family:var(--font-mono); letter-spacing:.1em;}
.podium-row{
  display:flex; align-items:flex-end; gap:8px;
  padding-bottom:0;
}
.podium{
  position:relative; flex:1; min-width:0;
  display:flex; flex-direction:column; align-items:center;
}
.wire{width:2px; height:22px; background:#555;}
/* 赤いモヤを削除し、純粋な揺れアニメーションのみ適用 */
.bomb-hang{font-size:21px; margin-bottom:2px; transition:.3s; filter:drop-shadow(0 2px 4px rgba(0,0,0,.6));}
.podium.active .bomb-hang{animation:swing 1.1s ease-in-out infinite;}
@keyframes swing{0%,100%{transform:rotate(-9deg);} 50%{transform:rotate(9deg);}}
.stand{
  width:100%;
  background:linear-gradient(180deg,#2c2e38,#15161c);
  border:2px solid #000; border-bottom:5px solid var(--gold);
  border-radius:6px 6px 2px 2px;
  padding:7px 3px 9px;
  text-align:center;
}
/* 名前部分の赤いエフェクトを削除し、黄色のハイライトに変更 */
.podium.active .stand{border-bottom-color:var(--gold); box-shadow:0 0 12px rgba(255,212,0,.45);}
.podium.done .stand{border-bottom-color:var(--ok);}
.podium.exploded .bomb-hang{filter:none;}
.podium.exploded .stand{background:linear-gradient(180deg,#1a1a1a,#0a0a0a); border-bottom-color:#444;}
.stand-name{font-family:var(--font-display); font-weight:800; font-size:10.5px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.podium.exploded .stand-name{color:#666; text-decoration:line-through;}
.podium-floor{height:8px; margin-top:8px;
  background:repeating-linear-gradient(90deg, rgba(255,212,0,.55) 0 10px, rgba(0,0,0,.55) 10px 20px);
}

/* ---- 導火線の処理：回答中のレーン内で爆弾が落下する ---- */
.stage-track{
  position:relative;
  display:flex; justify-content:center; align-items:flex-end; gap:8px;
  padding-top:8px;
  width:max-content;
  min-width:100%;
}
.stage-scroll{
  overflow-x:auto;
  overflow-y:hidden;
  padding:2px 0 8px;
  scrollbar-width:thin;
}
.stage-track .podium{
  flex:0 0 50px;
  opacity:.58;
}
.stage-track .podium.active{opacity:1;}

<body>
<div id="app"></div>

<script>
/* =========================================================
   ステート管理（ホストが更新し、PeerJSで参加者へ同期）
========================================================= */
const state = {
  screen: 'title',
  nickname: '',
  isHost: false,
  roomCode: '',
  joinCode: '',
  participants: [],
  players: [],
  mode: null, // 'intro_quiz' | 'quiz_only'
  introIndex: 0,
  introTimer: 30,
  introTimerHandle: null,
  quizIndex: 0, // 現在の出題ペアのindex
  questioner: null,
  answerer: null,
  question: null,
  changeCount: 0,
  prepTimer: 10,
  prepHandle: null,
  quizTimer: 30,
  quizHandle: null,
  hintUsed: false,
  hintText: '',
  viewAs: 'answerer', // デモ用の視点切替: 'questioner' / 'answerer'
  correctCount: 0,
  bombPosition: 0,
  answererOrder: [],
  roundTimeTotal: 30,
  history: [],
  cleared: null, // true/false
  finalScores: [],
  rating: ''
};

let peer = null;
let hostConnection = null;
let guestConnections = [];
let myPeerId = '';
let connectionStatus = 'idle';

const correctSound = new Audio('./sounds/correct.mp3');
const wrongSound = new Audio('./sounds/wrong.mp3');

correctSound.preload = 'auto';
wrongSound.preload = 'auto';

const QUESTIONS = [
  () => `${state.questioner}さんの好きな映画・ドラマのジャンルを${state.answererOrder.length}つ答えよ！`,
  () => `${state.questioner}さんの好きな旅行先を${state.answererOrder.length}つ答えよ！`,
  () => `${state.questioner}さんが休日にやりがちなことを${state.answererOrder.length}つ答えよ！`,
  () => `${state.questioner}さんの好きな食べ物を${state.answererOrder.length}つ答えよ！`,
  () => `${state.questioner}さんの好きな曲・アーティストを${state.answererOrder.length}つ答えよ！`,
  () => `${state.questioner}さんが行ったことのある都道府県を${state.answererOrder.length}つ答えよ！`,
  () => `${state.questioner}さんがコンビニでよく買うものを${state.answererOrder.length}つ答えよ！`,
  () => `${state.questioner}さんの好きな季節のイベントを${state.answererOrder.length}つ答えよ！`,
  () => `${state.questioner}さんが地味にこだわっていることを${state.answererOrder.length}つ答えよ！`,
  () => `${state.questioner}さんが最近ハマっているものを${state.answererOrder.length}つ答えよ！`,
  () => `${state.questioner}さんの苦手なものを${state.answererOrder.length}つ答えよ！`,
  () => `${state.questioner}さんの得意なことを${state.answererOrder.length}つ答えよ！`,
  () => `${state.questioner}さんが人より少し詳しい分野を${state.answererOrder.length}つ答えよ！`,
  () => `${state.questioner}さんが1週間休みをもらったらやりたいことを${state.answererOrder.length}つ答えよ！`,
  () => `${state.questioner}さんが100万円をもらったら使いたいことを${state.answererOrder.length}つ答えよ！`
];

function el(html){
  const d = document.createElement('div');
  d.innerHTML = html.trim();
  return d.firstChild;
}

const SCREEN_PHASE = {
  title:'ice', nickname:'ice', roomCreate:'ice', roomJoin:'ice',
  waitingRoom:'ice', modeSelect:'ice', introPrep:'ice', introRunning:'ice',
  quizStartGate:'ice',
  quizPrep:'hot', quizActive:'hot',
  quizRoundResult:'ice', finalResult:'ice'
};
const SCREEN_PROGRESS = {
  title:2, nickname:8, roomCreate:14, roomJoin:14, waitingRoom:20,
  modeSelect:26, introPrep:32, introRunning:38, quizStartGate:44,
  quizPrep:52, quizActive:72, quizRoundResult:90, finalResult:100
};

function setupChrome(){
  if(!document.getElementById('fuseBar')){
    const bar = document.createElement('div');
    bar.id = 'fuseBar';
    bar.innerHTML = '<div class="fill" id="fuseFill"></div>';
    document.body.appendChild(bar);
  }
  if(!document.getElementById('snowfield')){
    const snow = document.createElement('div');
    snow.id = 'snowfield';
    snow.className = 'snowfield';
    for(let i=0;i<18;i++){
      const flake = document.createElement('span');
      flake.textContent = '❄';
      flake.style.left = (Math.random()*100)+'%';
      flake.style.setProperty('--drift', (Math.random()*40-20)+'px');
      flake.style.animationDuration = (9+Math.random()*8)+'s';
      flake.style.animationDelay = (Math.random()*8)+'s';
      flake.style.fontSize = (10+Math.random()*10)+'px';
      snow.appendChild(flake);
    }
    document.body.appendChild(snow);
  }
}
function updateChrome(){
  const phase = SCREEN_PHASE[state.screen] || 'ice';
  document.body.classList.toggle('phase-ice', phase==='ice');
  document.body.classList.toggle('phase-hot', phase==='hot');
  const snow = document.getElementById('snowfield');
  if(snow) snow.style.display = phase==='ice' ? 'block' : 'none';
  const fill = document.getElementById('fuseFill');
  if(fill) fill.style.width = (SCREEN_PROGRESS[state.screen] || 0) + '%';
}

function render(skipAnimation = false){
  const app = document.getElementById('app');
  const visibleScreen = !state.isHost && state.screen === 'roomCreate' ? 'waitingRoom' : state.screen;
  const screenNode = SCREENS[visibleScreen]();
  if(skipAnimation) screenNode.style.animation = 'none';
  // DOMを入れ替えることで画面更新時のチラつきを抑える
  app.replaceChildren(screenNode);
  updateChrome();
}
function go(screen){
  const prevPhase = SCREEN_PHASE[state.screen] || 'ice';
  const nextPhase = SCREEN_PHASE[screen] || 'ice';
  state.screen = screen;
  if(prevPhase === 'ice' && nextPhase === 'hot'){
    render();
    showIgnite();
  } else {
    render();
  }
  if(state.isHost) broadcastState();
}

function sharedState(){
  const copy = {};
  Object.keys(state).forEach(key=>{
    if(!['nickname','isHost','viewAs','introTimerHandle','prepHandle','quizHandle'].includes(key)){
      copy[key] = state[key];
    }
  });
  return copy;
}

function broadcastState(renderRequired = true){
  if(!state.isHost) return;
  const message = {type:'SYNC_STATE', state:sharedState(), renderRequired};
  guestConnections = guestConnections.filter(conn=>conn.open);
  guestConnections.forEach(conn=>conn.send(message));
}

function broadcastEffect(effect){
  if(!state.isHost) return;
  guestConnections.filter(conn=>conn.open).forEach(conn=>
    conn.send({type:'PLAY_EFFECT', effect})
  );
}

function applySharedState(nextState, renderRequired = true){
  const previous = sharedState();
  const previousPhase = SCREEN_PHASE[previous.screen] || 'ice';
  const local = {
    nickname:state.nickname,
    isHost:state.isHost,
    viewAs:state.viewAs,
    introTimerHandle:state.introTimerHandle,
    prepHandle:state.prepHandle,
    quizHandle:state.quizHandle
  };
  Object.assign(state, nextState, local);
  if(!renderRequired && previous.screen === state.screen){
    updateSyncedTimer();
  } else {
    render(previous.screen === state.screen);
    const nextPhase = SCREEN_PHASE[state.screen] || 'ice';
    if(previousPhase === 'ice' && nextPhase === 'hot') showIgnite();
  }
}

function updateSyncedTimer(){
  if(state.screen === 'introRunning'){
    const timer = document.getElementById('timerNum');
    if(timer){
      timer.textContent = state.introTimer;
      timer.style.color = state.introTimer <= 5 ? 'var(--bad)' : 'var(--fuse-1)';
    }
    return;
  }
  if(state.screen === 'quizPrep'){
    const timer = document.getElementById('prepSec');
    if(timer) timer.textContent = state.prepTimer;
    return;
  }
  if(state.screen === 'quizActive'){
    const timer = document.getElementById('timerNum');
    const clock = document.getElementById('clockBox');
    if(timer) timer.textContent = state.quizTimer;
    if(clock) clock.classList.toggle('danger', state.quizTimer <= 5);
    updateBombDrop();
  }
}

function showConnectionError(message){
  alert(message);
}

function destroyPeer(){
  if(peer) peer.destroy();
  peer = null;
  hostConnection = null;
  guestConnections = [];
  myPeerId = '';
  connectionStatus = 'idle';
}

function createPeerRoom(){
  destroyPeer();
  state.players = [];
  state.participants = [];
  connectionStatus = 'connecting';
  state.roomCode = genCode();
  updateRoomCreateStatus();
  peer = new Peer(state.roomCode, {debug:2});
  peer.on('open', id=>{
    myPeerId = id;
    connectionStatus = 'connected';
    state.players = [{id, name:state.nickname}];
    state.participants = [state.nickname];
    if(state.screen === 'nickname') go('roomCreate');
    else updateRoomCreateStatus();
  });
  peer.on('connection', conn=>{
    guestConnections.push(conn);
    conn.on('data', data=>handleGuestMessage(data, conn));
    conn.on('close', ()=>removeGuest(conn.peer));
  });
  peer.on('error', error=>{
    if(error.type === 'unavailable-id'){
      createPeerRoom();
      return;
    }
    showConnectionError('部屋を作成できませんでした。インターネット接続を確認してください。');
  });
}

function connectToRoom(code){
  destroyPeer();
  state.players = [];
  state.participants = [];
  connectionStatus = 'connecting';
  peer = new Peer(undefined, {debug:2});
  peer.on('open', id=>{
    myPeerId = id;
    hostConnection = peer.connect(code);
    hostConnection.on('open', ()=>{
      connectionStatus = 'connected';
      hostConnection.send({type:'JOIN', id, name:state.nickname});
    });
    hostConnection.on('data', handleHostMessage);
    hostConnection.on('close', ()=>showConnectionError('ホストとの接続が切れました。'));
    hostConnection.on('error', ()=>showConnectionError('部屋に接続できませんでした。'));
  });
  peer.on('error', error=>{
    const message = error.type === 'peer-unavailable'
      ? '部屋が見つかりません。あいことばを確認してください。'
      : '接続できませんでした。インターネット接続を確認してください。';
    showConnectionError(message);
  });
}

function handleHostMessage(data){
  if(data.type === 'SYNC_STATE'){
    connectionStatus = 'connected';
    applySharedState(data.state, data.renderRequired !== false);
  }
  if(data.type === 'JOIN_ERROR'){
    connectionStatus = 'error';
    showConnectionError(data.message);
    destroyPeer();
    state.screen = 'roomJoin';
    render();
  }
  if(data.type === 'PLAY_EFFECT'){
    if(data.effect === 'iceBreak') showIceBreak(()=>{});
    if(data.effect === 'explosion') showExplosion(()=>{});
  }
}

function removeGuest(peerId){
  if(!state.isHost || !['roomCreate','waitingRoom'].includes(state.screen)) return;
  state.players = state.players.filter(player=>player.id !== peerId);
  state.participants = state.players.map(player=>player.name);
  broadcastState();
  refreshRoomDisplay();
}

function updateRoomCreateStatus(){
  const code = document.getElementById('hostRoomCode');
  const count = document.getElementById('hostParticipantCount');
  const confirm = document.getElementById('confirm');
  if(code) code.textContent = state.roomCode || '準備中…';
  if(count) count.textContent = `👥 ${state.participants.length}人が入室中(最大10人)`;
  if(confirm) confirm.disabled = state.participants.length < 2;
}

function refreshRoomDisplay(){
  if(state.screen === 'roomCreate'){
    updateRoomCreateStatus();
  } else {
    render(true);
  }
}

function playerFor(peerId){
  return state.players.find(player=>player.id === peerId);
}

function isAllowed(action, senderId){
  const player = playerFor(senderId);
  if(!player) return false;
  if(action === 'HINT') return state.screen === 'quizActive' && player.name === state.answererOrder[state.bombPosition];
  if(['CHANGE_QUESTION','DECIDE_QUESTION'].includes(action)){
    return state.screen === 'quizPrep' && player.name === state.questioner;
  }
  if(['JUDGE_CORRECT','JUDGE_WRONG'].includes(action)){
    return state.screen === 'quizActive' && player.name === state.questioner;
  }
  if(['PLAY_AGAIN','END_GAME'].includes(action)){
    return state.screen === 'quizRoundResult' && player.name === state.questioner;
  }
  return false;
}

function handleGuestMessage(data, conn){
  if(data.type === 'JOIN'){
    const name = cleanNickname(String(data.name || ''));
    if(!name){
      conn.send({type:'JOIN_ERROR', message:'ニックネームを入力してください。'});
      return;
    }
    if(state.players.some(player=>player.id === conn.peer)){
      conn.send({type:'SYNC_STATE', state:sharedState()});
      return;
    }
    if(state.players.some(player=>player.name === name)){
      conn.send({type:'JOIN_ERROR', message:'同じニックネームが使われています。別の名前で入り直してください。'});
      return;
    }
    if(state.players.length >= 10){
      conn.send({type:'JOIN_ERROR', message:'この部屋は満員です。'});
      return;
    }
    if(!['roomCreate','waitingRoom'].includes(state.screen)){
      conn.send({type:'JOIN_ERROR', message:'この部屋はすでにゲームを開始しています。'});
      return;
    }
    state.players.push({id:conn.peer, name});
    state.participants = state.players.map(player=>player.name);
    broadcastState();
    refreshRoomDisplay();
    return;
  }
  if(data.type === 'ACTION' && isAllowed(data.action, conn.peer)){
    performAction(data.action);
  }
}

function requestAction(action){
  if(state.isHost){
    performAction(action);
  } else if(hostConnection && hostConnection.open){
    hostConnection.send({type:'ACTION', action});
  }
}

function performAction(action){
  if(!state.isHost) return;
  if(action === 'CHANGE_QUESTION'){
    //if(state.changeCount >= 2) return;
    //state.changeCount++;
    const options = QUESTIONS.filter(createQuestion=>createQuestion() !== state.question);
    state.question = options[Math.floor(Math.random()*options.length)]();
    broadcastState();
    render();
  } else if(action === 'DECIDE_QUESTION'){
    clearInterval(state.prepHandle);
    state.quizTimer = state.roundTimeTotal;
    go('quizActive');
  } else if(action === 'HINT'){
    state.hintUsed = true;
    broadcastState();
    render();
  } else if(action === 'JUDGE_CORRECT'){
    handleCorrectAnswer();
  } else if(action === 'JUDGE_WRONG'){
    broadcastState();
  } else if(action === 'PLAY_AGAIN'){
    state.history.push({questioner:state.questioner, question:state.question, cleared:state.cleared});
    state.quizIndex++;
    startQuizRound();
  } else if(action === 'END_GAME'){
    state.history.push({questioner:state.questioner, question:state.question, cleared:state.cleared});
    go('finalResult');
  }
}
function showIgnite(){
  const overlay = document.createElement('div');
  overlay.className = 'ignite-overlay';
  overlay.innerHTML = `<div class="ignite-text">🔥 点火！</div>`;
  document.body.appendChild(overlay);
  setTimeout(()=>overlay.remove(), 1500);
}

function cleanNickname(value){
  return value.replace(/[<>&"'`]/g, '').trim().slice(0,10);
}

/* ---------- 1. タイトル ---------- */
function screenTitle(){
  return el(`
    <div class="screen">
      <div class="sunburst-wrap" style="text-align:center; padding:54px 0 30px;">
        <h1 class="tv-title" style="font-size:38px; margin:0 0 6px;">アイスボンバー</h1>
        <p class="sub" style="margin-top:8px;">相手を知りながら緊張をぶっ壊せ！<br>爆弾を回して、最後は氷をブレイク。</p>
      </div>
      <div class="hazard-tape"></div>
      <div class="card" style="text-align:center; padding:26px 20px; margin-top:14px;">

async function copyRoomCode(code){
  try{
    await navigator.clipboard.writeText(code);
  } catch(error){
    const input = document.createElement('textarea');
    input.value = code;
    input.style.position = 'fixed';
    input.style.opacity = '0';
    document.body.appendChild(input);
    input.select();
    document.execCommand('copy');
    input.remove();
  }
}

// 最初は青と赤。人数が増えるたび、positionの位置へ中間色を追加する。
const LANE_COLOR_STOPS = [
  {position:0,     hex:'#238bff', rgb:'35 139 255'},  // 青
  {position:1,     hex:'#df3f45', rgb:'223 63 69'},   // 赤
  {position:.5,    hex:'#f2d13d', rgb:'242 209 61'},  // 黄
  {position:.25,   hex:'#3dbb55', rgb:'61 187 85'},   // 緑
  {position:.75,   hex:'#f07b2d', rgb:'240 123 45'},  // オレンジ
  {position:.125,  hex:'#20b8c5', rgb:'32 184 197'},  // 青緑
  {position:.375,  hex:'#9acb3c', rgb:'154 203 60'},  // 黄緑
  {position:.625,  hex:'#f3a832', rgb:'243 168 50'},  // 琥珀
  {position:.875,  hex:'#ec5438', rgb:'236 84 56'},   // 朱色
  {position:.0625, hex:'#24a5e3', rgb:'36 165 227'}   // 水色
];

function buildLaneColors(count){
  return LANE_COLOR_STOPS.slice(0,count).sort((a,b)=>a.position-b.position);
}

function renderStageTrack(names, activeIndex){
  const laneColors = buildLaneColors(names.length);
  const podiums = names.map((name,i)=>{
    const cls = ['podium'];
    if(i===activeIndex) cls.push('active');
    if(i<activeIndex) cls.push('passed');
    const color = laneColors[i];
    const laneContent = i < activeIndex
      ? '<div class="cylinder-check">✓</div>'
      : i === activeIndex
      ? '<div class="roaming-bomb" id="roamingBomb">💣</div>'
      : '';
    const status = i < activeIndex ? '正解' : i === activeIndex ? '回答中' : '待機';
    return `
      <div class="${cls.join(' ')}" data-slot="${i}" style="--lane-color:${color.hex};--lane-rgb:${color.rgb}">
        <div class="cylinder-lane">${laneContent}</div>
        <div class="stand">
          <div class="stand-name">${name}</div>
          <div class="lane-status">${status}</div>
        </div>
      </div>`;
  }).join('');
  return `
    <div class="stage-scroll">
      <div class="stage-track" id="stageTrack">
        ${podiums}
        <div class="ice-block" id="iceBlock" data-slot="${names.length}">
          <div class="ice-emoji">🧊</div>
          <div class="ice-label">ICE BLOCK</div>
        </div>
      </div>
    </div>`;
}
function positionBomb(){
  const track = document.getElementById('stageTrack');
  if(!track) return;
  const targetSel = state.bombPosition >= state.answererOrder.length
    ? '#iceBlock' : `.podium[data-slot="${state.bombPosition}"]`;
  const target = track.querySelector(targetSel);
  if(!target) return;
  const scroller = track.closest('.stage-scroll');
  if(scroller){
    const targetCenter = target.offsetLeft + target.offsetWidth/2;
    const maxScroll = Math.max(0, scroller.scrollWidth - scroller.clientWidth);
    scroller.scrollLeft = Math.max(0, Math.min(maxScroll, targetCenter - scroller.clientWidth/2));
  }
}

/* 共通タイマーが減るほど、レールの中を爆弾がはっきり分かる速さで滑り落ちる（本家演出） */
const BOMB_RAIL_START = 8;
const BOMB_RAIL_TRAVEL = 76;
function updateBombDrop(animate = true){
  const bomb = document.getElementById('roamingBomb');
  if(!bomb) return;
  const total = state.roundTimeTotal || 30;
  const frac = Math.max(0, Math.min(1, state.quizTimer / total)); // 1=開始, 0=時間切れ
  // 経過時間に比例させ、試験管の中を最初から最後まで一定速度で落とす
  const y = 1 - frac;
  if(!animate) bomb.style.transition = 'none';
  bomb.style.top = (BOMB_RAIL_START + y * BOMB_RAIL_TRAVEL) + 'px';
  bomb.classList.toggle('critical', state.quizTimer <= 5);
  if(!animate){
    requestAnimationFrame(()=>{
      bomb.style.transition = 'top .92s linear';
    });
  }
}

      wrap.innerHTML = `

          ${state.hintUsed ? `<div class="hint-box">💡 ${answerer}さんがヒントを求めています。答えの頭文字などヒントを出してあげよう！</div>`:''}
          <div class="action-row">
            <button class="btn-circle btn-ok" id="ok">〇</button>
            <button class="btn-circle btn-ng" id="ng">×</button>
          </div>
        </div>
      `;
      wrap.querySelector('#ok').onclick = onCorrect;
      wrap.querySelector('#ng').onclick = onWrong;
    } else if(state.viewAs === 'answerer') {
      wrap.innerHTML = `
        <div class="card" style="text-align:center;">
          <p class="sub" style="margin-bottom:4px;">${answerer}さんの番です</p>
          <p class="sub" style="margin-bottom:12px;">思いついたら口頭で答えてね</p>
          ${state.hintUsed ? `<div class="hint-box">💡 ヒントをリクエスト中… 出題者からのヒントを待とう</div>` : `
          <button class="btn btn-secondary" id="hintBtn">💡 ヒントをもらう</button>`}
        </div>
      `;
      const hb = wrap.querySelector('#hintBtn');
      if(hb) hb.onclick = ()=>requestAction('HINT');
    } else {
      wrap.innerHTML = `
        <div class="card" style="text-align:center; color:var(--text-dim); font-size:13px;">
          ${answerer}さんが回答中です…
        </div>
      `;
    }
  }
  renderRoleView();

  function onCorrect(){
    correctSound.currentTime = 0;
    correctSound.play();
    requestAction('JUDGE_CORRECT');
  }
  function onWrong(){
    wrongSound.currentTime = 0;
    wrongSound.play();
    requestAction('JUDGE_WRONG');
    const wrap = node.querySelector('#roleView');
    const flash = document.createElement('div');
    flash.textContent = '❌ 不正解！同じ人が続けて回答します';
    flash.style.cssText = 'color:var(--bad); font-size:12px; text-align:center; margin-top:10px; font-family:var(--font-mono);';
    wrap.appendChild(flash);
    setTimeout(()=>flash.remove(), 1400);
  }
  function triggerIceBreak(){
    const ice = document.getElementById('iceBlock');
    if(ice) ice.classList.add('shatter');
    spawnShards();
    setTimeout(()=>{
      showIceBreak(()=>{ go('quizRoundResult', true); });
    }, 260);
  }
  function spawnShards(){
    const ice = document.getElementById('iceBlock');
    if(!ice) return;
    const bits = ['❄️','🧊','❄️','🧊','❄️','🧊'];
    bits.forEach((b)=>{
      const s = document.createElement('div');
      s.className = 'shard';
      s.textContent = b;
      const dx = (Math.random()-0.5)*140;
      const dy = -40 - Math.random()*70;
      s.style.setProperty('--tx', dx+'px');
      s.style.setProperty('--ty', dy+'px');
      ice.appendChild(s);
      setTimeout(()=>s.remove(), 750);
    });
  }

  // 1問を通してひとつだけのタイマー：新しい問題のときだけ初期化し、
  // 同じ問題中の再描画（正解して次の人へ／画面切替）では値を引き継ぐ
  clearInterval(state.quizHandle);
  if(state.isHost) state.quizHandle = setInterval(()=>{
    state.quizTimer--;
    const numEl = document.getElementById('timerNum');
    const center = document.getElementById('clockBox');
    if(numEl){
      numEl.textContent = state.quizTimer;
      if(state.quizTimer<=5 && center) center.classList.add('danger');
    }
    updateBombDrop();
    if(state.quizTimer<=0){
      clearInterval(state.quizHandle);
      const podiums = node.querySelectorAll('.podium');
      if(podiums[state.bombPosition]) podiums[state.bombPosition].classList.add('exploded');
      state.cleared = false;
      broadcastState();
      broadcastEffect('explosion');
      showExplosion(()=> go('quizRoundResult'));
    } else {
      broadcastState(false);
    }
  },1000);

  return node;
}

function handleCorrectAnswer(){
  clearInterval(state.quizHandle);
  state.bombPosition++;
  state.hintUsed = false;
  if(state.bombPosition >= state.answererOrder.length){
    state.cleared = true;
    broadcastState();
    broadcastEffect('iceBreak');
    showIceBreak(()=>go('quizRoundResult'));
  } else {
    go('quizActive');
  }
}

function showExplosion(callback){
  const overlay = document.createElement('div');
  overlay.className = 'explosion-overlay';
  overlay.innerHTML = `<div class="boom-text">💥<br>ドッカーン!!</div>`;
  document.body.appendChild(overlay);
  const app = document.getElementById('app');
  app.classList.add('shake');
  setTimeout(()=>{
    overlay.remove();
    app.classList.remove('shake');
    callback();
  }, 1500);
}

function showIceBreak(callback){
  const overlay = document.createElement('div');
  overlay.className = 'icebreak-overlay';
  overlay.innerHTML = `<div class="ice-text">🧊💥<br>アイスブレイク成功!!</div>`;
  document.body.appendChild(overlay);
  const app = document.getElementById('app');
  app.classList.add('shake');
  setTimeout(()=>{
    overlay.remove();
    app.classList.remove('shake');
    callback();
  }, 1500);
}

/* ---------- 11. 1問ごとの結果 ---------- */
function screenQuizRoundResult(){
  const wasCorrect = state.cleared;
  const node = el(`
    <div class="screen">
      <div class="result-hero">
        <div style="font-size:44px; margin-bottom:8px;">${wasCorrect ? '🧊💥' : '💥'}</div>
        <div class="stamp ${wasCorrect ? 'clear':'fail'}">${wasCorrect ? 'アイスブレイク成功！' : '時間切れ…'}</div>
      </div>
      <div class="card">
        ${wasCorrect ? `
          <p class="sub" style="margin-bottom:6px;">出題者以外の全員が正解！${state.questioner}さんからひとこと</p>
          <p style="font-size:14px; line-height:1.7;">「${state.question}」について、実は最近ハマったきっかけがあって……という感じで、答えを選んだ理由を話してもらいましょう。</p>
        ` : `
          <p class="sub" style="margin-bottom:6px;">${state.questioner}さんから正解発表</p>
          <p style="font-size:14px; line-height:1.7;">時間内に全員が正解できませんでした。${state.questioner}さんに正解と、その理由を発表してもらいましょう。</p>
        `}
      </div>
      <div class="score-pill">
        <span>答え終えた人数</span><b>${state.bombPosition} / ${state.answererOrder.length}</b>
      </div>
      <p class="sub" style="margin:2px 0 12px;">もう一度あそぶ？（新しい問題・出題者に交代します）</p>
      <div class="btn-row" style="display:${state.nickname === state.questioner ? 'flex' : 'none'}">
        <button class="btn btn-secondary" id="again">もう一度あそぶ</button>
        <button class="btn btn-primary" id="end">もう終わりにする</button>
      </div>
      ${state.nickname === state.questioner ? '' : '<div class="card" style="text-align:center; color:var(--text-dim); font-size:13px;">出題者の選択を待っています…</div>'}
    </div>
  `);
  node.querySelector('#again').onclick = ()=>{
    requestAction('PLAY_AGAIN');
  };
  node.querySelector('#end').onclick = ()=>{
    requestAction('END_GAME');
  };
  return node;
}

/* ---------- 12. 最終結果 ---------- */
function screenFinalResult(){
  const clearedN = state.history.filter(h=>h.cleared).length;
  const node = el(`
    <div class="screen">
      <div class="result-hero">
        <div style="font-size:50px; margin-bottom:6px;">🏆</div>
        <div class="stamp clear">おつかれさま！</div>
        <p class="sub" style="margin-top:4px;">今日は ${state.history.length}問中 ${clearedN}問 アイスブレイクに成功しました</p>
      </div>
      <div class="card">
        <div class="eyebrow" style="margin-bottom:10px;">今日の成績</div>
        <ul class="plist">
          ${state.history.map(h=>`<li><div class="avatar">${h.cleared?'🧊':'💥'}</div>「${h.question}」（出題：${h.questioner}）<span class="chip" style="margin-left:auto;">${h.cleared?'成功':'時間切れ'}</span></li>`).join('') || '<li style="color:var(--text-dim);">記録がありません</li>'}
        </ul>
      </div>
      <div class="card">
        <label class="field-label">今日の感想・評価（任意）</label>
        <textarea id="rating" placeholder="楽しかった！次はもっと難しい問題で…など"></textarea>
      </div>
      ${state.isHost ? '<button class="btn btn-primary" id="close">部屋に戻る</button>' : '<div class="card" style="text-align:center; color:var(--text-dim); font-size:13px;">主催者の操作を待っています…</div>'}
    </div>
  `);
  const closeButton = node.querySelector('#close');
  if(closeButton) closeButton.onclick = ()=>go('waitingRoom');
  return node;
}

const SCREENS = {
  title: screenTitle,
  nickname: screenNickname,
  roomCreate: screenRoomCreate,
  roomJoin: screenRoomJoin,
  waitingRoom: screenWaitingRoom,
  modeSelect: screenModeSelect,
  introPrep: screenIntroPrep,
  introRunning: screenIntroRunning,
  quizStartGate: screenQuizStartGate,
  quizPrep: screenQuizPrep,
  quizActive: screenQuizActive,
  quizRoundResult: screenQuizRoundResult,
  finalResult: screenFinalResult,
};

setupChrome();
document.getElementById('app').appendChild(screenTitle());
updateChrome();
document.getElementById('app').querySelector('#start') &&
  (document.getElementById('app').querySelector('#start').onclick = ()=>go('nickname'));
</script>
